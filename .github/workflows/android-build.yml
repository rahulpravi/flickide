name: Build Android APK

# Ithu main branch-il push cheyyumbolum, manual aayi trigger cheyyumbolum run aakum
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web App (Vite/React)
        run: npm run build

      - name: Setup Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform & Sync Capacitor
        run: |
          npm install @capacitor/android
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickIDE-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
